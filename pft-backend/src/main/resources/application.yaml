spring:
    application:
        name: PFT
    h2:
        console:
            enabled: true
            path: /h2-console
    datasource:
        url: jdbc:h2:mem:PFT
        username: sa
        password:
        driver-class-name: org.h2.Driver
    jpa:
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: create-drop
        database-platform: org.hibernate.dialect.H2Dialect
        show-sql: true
        properties:
            hibernate:
                format_sql: true

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: true
        path: /swagger-ui.html
server:
    port: 8080
    error:
        include-message: always

secret:
  key: 



